<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>분석 결과</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    pre { background:#f6f6f6; padding: 10px; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>분석 결과</h1>

  <h2>업로드 파일</h2>
  <p>{{ data.upload_filename }}</p>

  <h2>전사 (Transcript)</h2>
  <pre>{{ data.transcript }}</pre>

  <h2>구조화된 추출 결과 (JSON)</h2>
  <pre>{{ data.structure | tojson(indent=2, ensure_ascii=False) }}</pre>

  <p><a href="{{ url_for('index') }}">새 녹음하기</a></p>
</body>
</html>
